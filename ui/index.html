<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EveryBot</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --panel: #ffffff;
        --border: #e2e5ea;
        --text: #1f2933;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-soft: #e8efff;
        --bot: #eef1f5;
        --danger: #b91c1c;
        --ok: #16a34a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
        height: 100vh;
        display: grid;
        grid-template-columns: 280px 1fr;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .status {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .status.ok {
        background: var(--ok);
      }
      button {
        font: inherit;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.small {
        padding: 2px 8px;
        font-size: 12px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .list .item {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        text-align: left;
        width: 100%;
        background: var(--panel);
      }
      .list .item.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .item .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: space-between;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
      }
      code {
        font-size: 12px;
        background: var(--bot);
        padding: 1px 4px;
        border-radius: 4px;
      }
      header {
        padding: 14px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header .muted {
        color: var(--muted);
        font-size: 13px;
      }
      #thread {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.45;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--bot);
        border-bottom-left-radius: 4px;
      }
      .msg .tag {
        display: block;
        font-size: 11px;
        opacity: 0.7;
        margin-top: 6px;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }
      textarea {
        flex: 1;
        font: inherit;
        resize: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        min-height: 44px;
        max-height: 160px;
      }
      textarea:focus {
        outline: 2px solid var(--accent-soft);
        border-color: var(--accent);
      }
      select {
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 8px;
        background: var(--panel);
      }
      #error {
        color: var(--danger);
        padding: 0 24px 12px;
        min-height: 18px;
        font-size: 13px;
      }
      @media (max-width: 720px) {
        body {
          grid-template-columns: 1fr;
        }
        aside {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <h1><span id="status" class="status" title="server status"></span>EveryBot</h1>

      <section>
        <div class="row">
          <h2>Sessions</h2>
          <button type="button" class="small" id="newSession">New chat</button>
        </div>
        <div id="sessions" class="list"></div>
      </section>

      <section>
        <h2>Pending approvals</h2>
        <div id="approvals" class="list"></div>
      </section>

      <section>
        <h2>Scheduled tasks</h2>
        <div id="tasks" class="list"></div>
      </section>
    </aside>

    <main>
      <header>
        <div id="sessionTitle">No session selected</div>
        <div class="muted">Replies also arrive by e-mail when the mail channel is configured</div>
      </header>
      <div id="thread"></div>
      <div id="error" role="alert"></div>
      <form id="composer">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message EveryBot… (Enter to send, Shift+Enter for a new line)"
        ></textarea>
        <select id="agentSelect" title="agent">
          <option value="default">default</option>
          <option value="files">files</option>
          <option value="scheduler">scheduler</option>
        </select>
        <button type="submit" class="primary" id="sendBtn">Send</button>
      </form>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const state = { sessionId: null, sending: false };

      async function api(path, options = {}) {
        const res = await fetch(path, {
          method: options.method || "GET",
          headers: options.body ? { "Content-Type": "application/json" } : {},
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        return data;
      }

      function el(tag, props = {}, children = []) {
        const node = document.createElement(tag);
        Object.assign(node, props);
        for (const child of children) node.append(child);
        return node;
      }

      function setError(message) {
        $("error").textContent = message || "";
      }

      async function refreshHealth() {
        try {
          await api("/health");
          $("status").classList.add("ok");
        } catch {
          $("status").classList.remove("ok");
        }
      }

      async function loadSessions() {
        const { sessions } = await api("/api/sessions");
        const box = $("sessions");
        box.replaceChildren();
        if (!sessions.length) box.append(el("div", { className: "empty", textContent: "No sessions yet." }));
        if (!state.sessionId && sessions.length) state.sessionId = sessions[0].convId;
        for (const s of sessions) {
          const button = el(
            "button",
            { type: "button", className: "item" + (s.convId === state.sessionId ? " active" : "") },
            [
              el("div", { textContent: s.convId }),
              el("div", {
                className: "meta",
                textContent: `${s.agentId} · ${(s.updatedAt || "").slice(0, 16).replace("T", " ")}`,
              }),
            ]
          );
          button.addEventListener("click", () => selectSession(s.convId));
          box.append(button);
        }
      }

      async function loadThread() {
        const box = $("thread");
        box.replaceChildren();
        if (!state.sessionId) {
          $("sessionTitle").textContent = "New chat";
          box.append(el("div", { className: "empty", textContent: "Send a message to start a new session." }));
          return;
        }
        $("sessionTitle").textContent = `Session ${state.sessionId}`;
        const { thread } = await api(`/api/thread?sessionId=${encodeURIComponent(state.sessionId)}`);
        if (!thread.length) box.append(el("div", { className: "empty", textContent: "No messages yet." }));
        for (const m of thread) {
          const tag = m.role === "bot" ? `#${m.msgNo ?? "?"} · ${m.agentId ?? "bot"}` : "you";
          box.append(
            el("div", { className: `msg ${m.role}` }, [m.text, el("span", { className: "tag", textContent: tag })])
          );
        }
        box.scrollTop = box.scrollHeight;
      }

      async function loadApprovals() {
        const { pending } = await api("/api/approvals");
        const box = $("approvals");
        box.replaceChildren();
        if (!pending.length) box.append(el("div", { className: "empty", textContent: "Nothing waiting." }));
        for (const p of pending) {
          const approve = el("button", { type: "button", className: "small primary", textContent: "Approve" });
          const reject = el("button", { type: "button", className: "small", textContent: "Reject" });
          approve.addEventListener("click", () => decide(p.id, "approve"));
          reject.addEventListener("click", () => decide(p.id, "reject"));
          box.append(
            el("div", { className: "item" }, [
              el("div", { textContent: `${p.tool} ${p.args?.path ?? ""}` }),
              el("div", { className: "row" }, [
                el("span", { className: "meta", textContent: p.at.slice(11, 19) }),
                el("span", {}, [approve, reject]),
              ]),
            ])
          );
        }
      }

      async function decide(id, action) {
        try {
          await api(`/api/approvals/${encodeURIComponent(id)}/${action}`, { method: "POST" });
          await loadApprovals();
        } catch (e) {
          setError(e.message);
        }
      }

      async function loadTasks() {
        const { tasks } = await api("/api/tasks");
        const box = $("tasks");
        box.replaceChildren();
        if (!tasks.length)
          box.append(el("div", { className: "empty", textContent: "No tasks. Create one with POST /api/tasks." }));
        for (const t of tasks) {
          const run = el("button", { type: "button", className: "small", textContent: "Run" });
          const remove = el("button", { type: "button", className: "small", textContent: "Delete" });
          run.addEventListener("click", () => taskAction(t.id, "run"));
          remove.addEventListener("click", () => taskAction(t.id, "delete"));
          box.append(
            el("div", { className: "item" }, [
              el("div", {}, [
                el("code", { textContent: t.cron }),
                ` ${t.action.type}${t.enabled ? "" : " (disabled)"}`,
              ]),
              el("div", { className: "row" }, [
                el("span", { className: "meta", textContent: t.id }),
                el("span", {}, [run, remove]),
              ]),
            ])
          );
        }
      }

      async function taskAction(id, action) {
        try {
          if (action === "delete") {
            if (!confirm(`Delete task ${id}?`)) return;
            await api(`/api/tasks/${encodeURIComponent(id)}`, { method: "DELETE" });
          } else {
            const result = await api(`/api/tasks/${encodeURIComponent(id)}/run`, { method: "POST" });
            if (!result.ok) setError(`Task failed: ${result.detail}`);
          }
          await Promise.all([loadTasks(), loadApprovals(), loadSessions()]);
        } catch (e) {
          setError(e.message);
        }
      }

      async function selectSession(id) {
        state.sessionId = id;
        setError("");
        await Promise.all([loadSessions(), loadThread()]);
      }

      async function sendMessage() {
        const text = $("messageInput").value.trim();
        if (!text || state.sending) return;
        state.sending = true;
        $("sendBtn").disabled = true;
        $("messageInput").disabled = true;
        setError("");
        try {
          const data = await api("/api/chat", {
            method: "POST",
            body: { sessionId: state.sessionId || undefined, message: text, agentId: $("agentSelect").value },
          });
          state.sessionId = data.sessionId;
          $("messageInput").value = "";
          await Promise.all([loadSessions(), loadThread()]);
        } catch (e) {
          setError(`Send failed: ${e.message}`);
        } finally {
          state.sending = false;
          $("sendBtn").disabled = false;
          $("messageInput").disabled = false;
          $("messageInput").focus();
        }
      }

      $("composer").addEventListener("submit", (e) => {
        e.preventDefault();
        sendMessage();
      });
      $("messageInput").addEventListener("keydown", (e) => {
        // isComposing: Enter confirms an IME candidate (Chinese/Japanese input); never send then.
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          sendMessage();
        }
      });
      $("newSession").addEventListener("click", () => {
        state.sessionId = null;
        Promise.all([loadSessions(), loadThread()]).catch((e) => setError(e.message));
        $("messageInput").focus();
      });

      async function refreshAll() {
        await Promise.all([refreshHealth(), loadSessions(), loadApprovals(), loadTasks()]);
        await loadThread();
      }
      refreshAll().catch((e) => setError(e.message));
      setInterval(() => Promise.all([refreshHealth(), loadApprovals(), loadTasks()]).catch(() => {}), 10000);
    </script>
  </body>
</html>
